# Déploiement des migrations en production (tâche 10.9, ADR-011) : uniquement
# par ce workflow, déclenché à la main. Pas de staging (décision du
# propriétaire, 2026-10-22) : les migrations sont essayées sur la base de
# développement et vérifiées par la CI (base reconstruite de zéro, pgTAP)
# avant d'arriver ici. Offre GitHub gratuite : pas d'approbation obligatoire,
# remplacée par une confirmation à taper. Aperçu, puis application.
name: deploiement-base

on:
  workflow_dispatch:
    inputs:
      cible:
        description: Environnement
        type: choice
        options: [production]
        required: true
      confirmation:
        description: Tapez PRODUCTION pour confirmer
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploiement-base-${{ inputs.cible }}
  cancel-in-progress: false

jobs:
  migrations:
    name: Migrations → ${{ inputs.cible }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.cible }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "PRODUCTION" ]; then
            echo "::error::Confirmation absente : tapez PRODUCTION pour déployer."
            exit 1
          fi

      - name: Projet cible
        run: |
          test -n "$SUPABASE_PROJECT_REF"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Aperçu des migrations à appliquer
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Application
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Avertissements de sécurité et de performance
        run: supabase db advisors --linked --type all --level warn
