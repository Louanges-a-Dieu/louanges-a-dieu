name: louanges_a_dieu
description: "Recueil de cantiques Louanges à Dieu"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_session: ^0.2.4
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sentry_flutter: 9.30.1
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: 6.3.2
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  generate: true
  assets:
    - assets/catalog/
    - assets/content/
    - assets/images/
    - assets/projection/
    - assets/fonts/CormorantGaramond/OFL.txt
    - assets/fonts/Literata/OFL.txt
    - assets/fonts/Inter/OFL.txt
  # Polices sous licence SIL OFL 1.1 (registre : docs/ownership/assets.md) :
  # Cormorant Garamond (titres, numéros), Literata (paroles), Inter (interface).
  # Polices variables : graisse (et taille optique) appliquées par le thème.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond/CormorantGaramond-VF.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata/Literata-VF.ttf
        - asset: assets/fonts/Literata/Literata-Italic-VF.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VF.ttf
  uses-material-design: true
